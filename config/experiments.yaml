# Experiment presets for CS7IS2 Assignment 1

presets:
  final_perfect:
    mode: full          # full = search + MDP, search_only = only BFS/DFS/A*
    maze_type: perfect
    sizes: [15, 31, 51]
    seeds: [1, 2, 3, 4, 5]
    gammas: [0.9, 0.95, 0.99]
    theta: 1e-6
    mazes_dir: results/mazes
    out_csv: results/raw/final_perfect_FINAL.csv

  final_random:
    mode: full
    maze_type: random
    sizes: [15, 31, 51]
    seeds: [1, 2, 3, 4, 5]
    gammas: [0.9, 0.95, 0.99]
    theta: 1e-6
    density: 0.25
    mazes_dir: results/mazes
    out_csv: results/raw/final_random_FINAL.csv

  density_sweep_d025:
    mode: full
    maze_type: random
    sizes: [31, 51]
    seeds: [1, 2, 3, 4, 5]
    gammas: [0.95]
    theta: 1e-6
    density: 0.25
    mazes_dir: results/mazes
    out_csv: results/raw/density_sweep/random_density_025.csv

  large_search_100_random:
    mode: search_only
    maze_type: random
    sizes: [100]
    seeds: [1, 2, 3]
    density: 0.25
    mazes_dir: results/mazes
    out_csv: results/raw/large_sweep/search_only_random_100_d025.csv
    track_peak_mem: true

  large_search_100_perfect:
    mode: search_only
    maze_type: perfect
    sizes: [100]
    seeds: [1, 2, 3]
    mazes_dir: results/mazes
    out_csv: results/raw/large_sweep/search_only_perfect_100.csv
    track_peak_mem: true
